<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caballeros Eternos · animaciones</title><link rel="stylesheet" href="viewer.css"></head>
<body><header class="top"><a class="brand" href="index.html"><span class="crest">✦</span><span>CABALLEROS ETERNOS<small>BEN 10 · BIBLIOTECA DE ANIMACIONES</small></span></a><span id="totalLabel"></span><a class="catalog-link" href="catalogo.html">Ver todos los diseños ↗</a></header>
<main><section class="workspace"><div class="unit-heading"><div><span id="unitCategory" class="eyebrow"></span><h1 id="unitName"></h1><p id="unitDescription"></p></div><div class="exports"><a id="downloadAtlas" download>Lámina PNG ↓</a><a id="downloadData" download>Datos de animación ↓</a></div></div>
<div class="stage"><canvas id="stage" tabindex="0" aria-label="Animación del enemigo seleccionado"></canvas><div id="loading">Preparando las animaciones…</div><span id="actionLabel" class="stage-tag"></span></div>
<nav id="animations" class="animations" aria-label="Animaciones"></nav>
<div class="playback"><button id="play" aria-label="Pausar">Ⅱ Pausar</button><button id="previous" aria-label="Fotograma anterior">‹</button><div id="frames" aria-label="Fotogramas"></div><button id="next" aria-label="Fotograma siguiente">›</button><span id="frameLabel">1 / 6</span><label class="speed">Velocidad <select id="speed"><option value=".25">0,25×</option><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label></div>
<div class="options"><div class="facing" aria-label="Orientación"><button data-facing="left">← Izquierda</button><button data-facing="right" class="active">Derecha →</button></div><label><input id="repeat" type="checkbox"> Repetir ataques y caídas</label><label><input id="compare" type="checkbox"> Comparar armaduras</label><label><input id="showBen" type="checkbox" checked> Referencia de Ben</label><label>Fondo <select id="background"><option value="plain">Liso</option><option value="castillo">Castillo</option><option value="laboratorio">Laboratorio</option><option value="ciudad">Calle</option><option value="alpha">Transparencia</option></select></label></div>
<footer><span><kbd>Espacio</kbd> reproducir / pausa · <kbd>← →</kbd> fotograma</span><label><input id="showPivot" type="checkbox"> Ver anclaje</label></footer></section>
<aside class="roster"><div class="roster-title"><h2>La orden</h2><span id="visibleCount"></span></div><div id="roleFilters" class="filters"></div><label class="tier-filter">Armadura<select id="tierFilter"><option value="all">Todas</option><option value="recruit">Reclutas</option><option value="elite">Veteranos</option><option value="crystal">ADN de Diamante</option><option value="normal">Minijefe normal</option></select></label><div id="unitList"></div></aside></main>
<script src="data/catalog.js"></script><script src="sprites.js"></script><script src="viewer.js"></script></body></html>
